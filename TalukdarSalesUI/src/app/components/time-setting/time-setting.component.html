
<div class="d-flex justify-content-between flex-wrap flex-md-nowrap align-items-center pt-3 pb-2 mb-3 border-bottom">
    <h1 class="h2">Time SetUp</h1>
</div>

<div class="time-setting-container">
    <div class="time-input-group">
        <label for="fromTime" class="time-label">From Time:</label>
        <input type="time" id="fromTime" [(ngModel)]="selectedFromTime" class="time-input" required>
    </div>
    <div class="time-input-group">
        <label for="toTime" class="time-label">To Time:</label>
        <input type="time" id="toTime" [(ngModel)]="selectedToTime" class="time-input" required>
    </div>
    <button type="button" (click)="onSubmit()" class="submit-button">Submit</button>
</div>
