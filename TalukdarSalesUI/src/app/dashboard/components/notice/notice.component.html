
<div
class="d-flex justify-content-between flex-wrap flex-md-nowrap align-items-center pt-3 pb-2 mb-3 border-bottom">
<h1 class="h2">Notice</h1>
</div>
        <button (click)="openNoticeModal()"><span>Create Notice</span></button>
        
        <div class="table-responsive">
            <table class="table table-striped table-sm">
                <thead>
                    <tr>
                        <th scope="col">#</th>
                        <th scope="col"></th>
                        <th scope="col">Title</th>
                        <th scope="col">Creation Time</th>
                        <th scope="col">Description</th>

                    </tr>
                </thead>
                <tbody>
                    <tr *ngFor="let notice of notices; let i= index">
                        <td>{{i+1}}</td>
                        <img [src]="'/wwwroot/images/notices/' + notice.logoName" alt="Notice Logo" width="50" height="50">
                        <td>{{notice.title}}</td>
                        <td>{{notice.createdOn}}</td>
                        <td>{{notice.description}}</td>
                    </tr>
        
                </tbody>
            </table>
        </div>
        
        <div>
            
            <modal id="notice" *ngIf="createModal" >
                <div class="modal-header">
                    <h5 class="modal-title">Create Notice</h5>
                    <button type="button" class="btn-close" (click)="closeModal()"></button>
                </div>
                <div class="modal-body">
                    <form (ngSubmit)="onSubmit()" [formGroup]="createNoticeForm">
                        <div class="form-group pt-3">
                            <div class="input-field" [class.error]="createNoticeForm.controls['title'].dirty && createNoticeForm.hasError('required','title')"> 
                                <span class="fa fa-user p-2"></span> 
                                <input formControlName="title" type="text" placeholder="Title"> </div>
                        </div>
                        <small *ngIf="createNoticeForm.controls['title'].dirty && createNoticeForm.hasError('required','title')" class="text-danger">*Title is required*</small>
                        
                        <div class="form-group pt-3">
                            <div class="input-field" [class.error]="createNoticeForm.controls['description'].dirty && createNoticeForm.hasError('required','description')"> 
                                <span class="fa fa-user p-2"></span> 
                                <textarea formControlName="description" rows="6" cols="160" type="text" placeholder="Description"> </textarea>
                            </div>
                        </div>
                        <!-- <div class="form-group pt-3">
                            <quill-editor formControlName="description"></quill-editor>
                        </div> -->
                        <small *ngIf="createNoticeForm.controls['title'].dirty && createNoticeForm.hasError('required','description')" class="text-danger">*Description is required*</small>
                        
                        <div class="form-group pt-3">
                            <div class="input-field">
                                <span class="fa fa-user p-2"></span>
                                <input formControlName="image" type="file" (change)="onFileChange($event)">
                            </div>
                        </div>
                        <small *ngIf="fileError" class="text-danger">{{ fileError }}</small>

                        <button *ngIf="!submitting" type="submit" class="btn btn-primary btn-block mt-4 w-100">Save</button>
                        <button type="button" class="btn btn-primary" *ngIf="submitting">
                            <i class="fas fa-spinner fa-pulse"></i>
                        </button>
                    </form>
                </div>
            </modal>
            
         
        </div>
