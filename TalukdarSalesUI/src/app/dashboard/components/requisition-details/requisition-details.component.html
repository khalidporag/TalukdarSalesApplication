<div class="table-responsive mt-25">
    <table class="table table-striped table-sm">
        <thead>
            <tr>
                <th scope="col">#</th>
                <th scope="col">Item Name</th>
                <th scope="col">Quantity</th>
                <th scope="col">Price</th>
                <th scope="col">Created On</th>
            </tr>
        </thead>
        <tbody>
            <tr *ngFor="let requisition of requisitionDetailsList; let i= index">
                <td>{{i+1}}</td>
                <td>{{requisition.finishedGoodName}}</td>
                <td>{{requisition.quantity}}</td>
                <td>{{requisition.price}}</td>
                <td>{{requisition.createdDateTime}}</td>
            </tr>
        </tbody>
    </table>
</div>
